</style></head><body><main class="shell"><header><h1 class="brand">NEON <span>BREAKER</span></h1><div class="tag">CLASSIC ARCADE · 01</div></header><section class="hud"><div class="stat"><small>SCORE</small><b id="score">000000</b></div><div class="stat"><small>BEST</small><b id="best">000000</b></div><div class="stat"><small>STAGE</small><b id="stageNo">01</b></div><div class="stat"><small>LIVES</small><b id="lives">♥ ♥ ♥</b></div><div class="spacer"></div><button class="sound" id="sound" type="button">♫ ON</button></section><div class="stage"><canvas id="game" width="540" height="810" tabindex="0" aria-label="ブロック崩しゲーム"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="title">READY?</h2><p id="message">パドルを動かしてボールを打ち返そう。<br>マウス・タッチ・矢印キーで操作できます。</p><button class="primary" id="start" type="button">ゲームスタート</button></div></div></div><div class="mobile-controls"><button id="left" aria-label="左へ">◀</button><button id="fire" aria-label="発射">●</button><button id="right" aria-label="右へ">▶</button><button id="pause" aria-label="一時停止">Ⅱ</button></div><div class="hint"><span class="desktop-hint">タッチでパドル操作 · ●で発射</span><span>全5ステージ</span></div><div class="hint"><span>W ワイド · S スロー · × ボール増加 · ✦ ノヴァ</span><span>ボールは連続ヒットで加速</span></div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
const el=id=>document.getElementById(id),ui={score:el('score'),best:el('best'),stage:el('stageNo'),lives:el('lives'),overlay:el('overlay'),title:el('title'),message:el('message'),start:el('start')};
let best=0;try{best=Number(localStorage.getItem('neonBreakerBest'))||0}catch{}ui.best.textContent=String(best).padStart(6,'0');
let score=0,lives=3,level=1,lastPachi=0,playing=false,launched=false,paused=false,continueStage=false,keys={left:false,right:false},bricks=[],particles=[],drops=[],trail=[],extraBalls=[],combo=0,comboEnd=0,flash='',flashEnd=0,last=0,shake=0,slowUntil=0,muted=false,audio=null;
function tone(freq=440,duration=.08,wave='sine',volume=.045){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
const paddle={x:W/2-65,y:H-56,w:130,h:13,speed:9},ball={x:W/2,y:H-76,r:9,vx:4,vy:-5.8};
const colors=['#ff5fa2','#ff9e57','#ffd166','#55e5c9','#5eb6ff','#ae8bff'];
function hud(){ui.score.textContent=String(score).padStart(6,'0');ui.best.textContent=String(best).padStart(6,'0');ui.stage.textContent=String(level).padStart(2,'0');ui.lives.textContent=Array.from({length:lives},()=> '♥').join(' ')||'—'}
function makeBricks(){bricks=[];const cols=9,rows=Math.min(11+level,16),bw=48,gap=8,left=(W-(cols*bw+(cols-1)*gap))/2,cx=(cols-1)/2;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++){let px=left+col*(bw+gap)+(r%2)*4,py=62+r*26;const ring=Math.hypot((col-cx)/6,(r-(rows-1)/2)/(rows*.58));if(level===1){py+=Math.round(Math.sin(col*.7)*7);if((r===0||r===rows-1)&&col%2===0)continue}else if(level===2){py+=Math.round(Math.sin(col*.8+r*.55)*11);if((col+r*2)%11===0)continue}else if(level===3){px+=r;py+=Math.round(Math.cos(col*.55)*8);if((col+Math.floor(r/2))%12===0)continue}else if(level===4){py+=col<3?Math.abs(col-2)*3:col>8?Math.abs(col-9)*3:Math.sin(r*.8)*5;if(r===1&&col>=4&&col<=7)continue}else{py+=Math.round(Math.sin((col-cx)*.65)*10+Math.cos(r*.65)*4);if(ring>.91&&(col+r)%2===0)continue;if(ring>.36&&ring<.47&&col%2===0)continue}bricks.push({x:px,y:py,w:bw,h:17,hp:level>=4&&r<2?2:1,color:colors[(r+level-1)%colors.length],alive:true})}}
function breakSound(){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime,dur=.14,size=Math.floor(audio.sampleRate*dur),buf=audio.createBuffer(1,size,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<size;i++){const t=i/size;data[i]=(Math.random()*2-1)*Math.pow(1-t,2.8)}const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),ng=audio.createGain();noise.buffer=buf;filter.type='bandpass';filter.frequency.setValueAtTime(1100+Math.random()*500,now);filter.Q.value=.7;ng.gain.setValueAtTime(.34,now);ng.gain.exponentialRampToValueAtTime(.001,now+dur);noise.connect(filter);filter.connect(ng);ng.connect(audio.destination);noise.start(now);noise.stop(now+dur);const thump=audio.createOscillator(),tg=audio.createGain();thump.type='triangle';thump.frequency.setValueAtTime(145,now);thump.frequency.exponentialRampToValueAtTime(48,now+.12);tg.gain.setValueAtTime(.2,now);tg.gain.exponentialRampToValueAtTime(.001,now+.13);thump.connect(tg);tg.connect(audio.destination);thump.start(now);thump.stop(now+.14)}catch{}}
function pachiPing(freq=880){if(muted||performance.now()-lastPachi<55)return;lastPachi=performance.now();tone(freq,.065,'sine',.052);setTimeout(()=>tone(freq*1.26,.075,'sine',.045),34)}
function jackpotCue(){[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sine',.06),i*68));tone(120,.28,'triangle',.09)}
function parkBall(){launched=false;trail=[];ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2;ball.vx=(Math.random()<.5?-1:1)*(5.4+level*.25);ball.vy=-(8.3+level*.4)}
function startGame(){continueStage=false;score=0;lives=3;level=1;particles=[];drops=[];trail=[];extraBalls=[];combo=0;slowUntil=0;paddle.w=130;paddle.x=(W-paddle.w)/2;playing=true;paused=false;makeBricks();parkBall();hud();ui.overlay.classList.add('hidden');canvas.focus({preventScroll:true});tone(660,.12,'triangle',.06)}
function show(title,msg,button){playing=false;ui.title.textContent=title;ui.message.innerHTML=msg;ui.start.textContent=button||'もう一度遊ぶ';ui.overlay.classList.remove('hidden')}
function fire(){if(!playing)return;if(paused){paused=false;ui.overlay.classList.add('hidden')}if(!launched){launched=true;tone(520,.08,'triangle',.05)}}
ui.start.addEventListener('click',()=>{if(paused){paused=false;ui.overlay.classList.add('hidden');canvas.focus({preventScroll:true})}else if(continueStage){continueStage=false;playing=true;paused=false;ui.overlay.classList.add('hidden');canvas.focus({preventScroll:true});tone(660,.12,'triangle',.06)}else startGame()});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();paddle.x=(e.clientX-r.left)*W/r.width-paddle.w/2;paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x))});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus({preventScroll:true});const r=canvas.getBoundingClientRect();paddle.x=(e.clientX-r.left)*W/r.width-paddle.w/2;paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x));fire()});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='arrowright'||e.code==='Space')e.preventDefault();if(k==='arrowleft')keys.left=true;if(k==='arrowright')keys.right=true;if(e.code==='Space'&&!e.repeat){if(!playing)startGame();else fire()}if(k==='p'&&playing){paused=!paused;if(paused){ui.title.textContent='PAUSED';ui.message.textContent='スペースキーか「つづける」で再開';ui.start.textContent='つづける';ui.overlay.classList.remove('hidden')}else ui.overlay.classList.add('hidden')}},false);
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function bindHold(id,key){const b=el(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId);canvas.focus({preventScroll:true})});b.addEventListener('pointerup',()=>keys[key]=false);b.addEventListener('pointercancel',()=>keys[key]=false);b.addEventListener('lostpointercapture',()=>keys[key]=false)}bindHold('left','left');bindHold('right','right');el('pause').addEventListener('click',()=>{if(!playing)return;paused=!paused;if(paused){ui.title.textContent='PAUSED';ui.message.textContent='「つづける」を押して再開';ui.start.textContent='つづける';ui.overlay.classList.remove('hidden')}else ui.overlay.classList.add('hidden')});el('fire').addEventListener('pointerdown',e=>{e.preventDefault();fire()});el('sound').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'♫ OFF':'♫ ON';if(!muted)tone(740,.1,'sine',.05)});
function burst(b,big=false){const n=big?46:18;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(big?2:1)+(Math.random()*(big?7:4));particles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:big?(i%2?'#fff1a8':'#ffd166'):b.color,size:big?3:2})}}
function update(dt){if(playing&&!paused){if(keys.left)paddle.x-=paddle.speed*dt;if(keys.right)paddle.x+=paddle.speed*dt;paddle.x=Math.max(12,Math.min(W-paddle.w-12,paddle.x));const slowFactor=(performance.now()<slowUntil) ? .76 : 1;if(!launched){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-2}else{ball.x+=ball.vx*dt*slowFactor;ball.y+=ball.vy*dt*slowFactor;trail.push({x:ball.x,y:ball.y,life:1});if(trail.length>12)trail.shift();if(ball.x<ball.r+8){ball.x=ball.r+8;ball.vx=Math.abs(ball.vx);pachiPing(980+Math.random()*260)}if(ball.x>W-ball.r-8){ball.x=W-ball.r-8;ball.vx=-Math.abs(ball.vx);pachiPing(980+Math.random()*260)}if(ball.y<ball.r+8){ball.y=ball.r+8;ball.vy=Math.abs(ball.vy);pachiPing(1160)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){let off=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2),speed=Math.hypot(ball.vx,ball.vy);ball.vx=off*speed*.82;ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx);ball.y=paddle.y-ball.r;pachiPing(760+Math.abs(off)*520);shake=Math.max(shake,2)}
if(ball.y>H+20){if(extraBalls.length){Object.assign(ball,extraBalls.shift());trail=[];flash='BALL SAVED!';flashEnd=performance.now()+850;shake=5;tone(620,.12,'triangle',.05)}else{combo=0;lives--;trail=[];tone(130,.28,'sawtooth',.06);shake=12;hud();if(lives<=0)show('GAME OVER',`スコア <b>${String(score).padStart(6,'0')}</b>`);else parkBall()}}
for(const b of bricks)if(b.alive&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){ball.vy*=-1;b.hp--;if(!b.hp){b.alive=false;combo=performance.now()<comboEnd?combo+1:1;comboEnd=performance.now()+2600;score+=10*level*Math.min(combo,10);breakSound();pachiPing(820+Math.min(combo,8)*65);if(combo%4===0){const currentSpeed=Math.hypot(ball.vx,ball.vy),nextSpeed=Math.min(15.2,currentSpeed+.55);ball.vx*=nextSpeed/currentSpeed;ball.vy*=nextSpeed/currentSpeed;}if(combo%5===0){const bonus=50*level*combo;score+=bonus;flash=combo+' HIT COMBO!  +'+bonus;flashEnd=performance.now()+1200;shake=Math.max(shake,10);burst(b,true);jackpotCue()}else if(combo===1){flash='';flashEnd=0;shake=Math.max(shake,3);burst(b)}else{burst(b)}if(Math.random()<.18)drops.push({x:b.x+b.w/2,y:b.y,type:['wide','slow','multi','nova'][Math.floor(Math.random()*4)]});if(score>best){best=score;try{localStorage.setItem('neonBreakerBest',best)}catch{}}hud()}else{tone(360,.06,'square',.04);pachiPing(900)}break}
if(bricks.every(b=>!b.alive)){if(level===5){score+=lives*100;hud();tone(784,.18,'triangle',.07);setTimeout(()=>tone(988,.2,'triangle',.06),120);setTimeout(()=>tone(1175,.3,'triangle',.06),250);shake=14;show('YOU WIN!',`最終スコア <b>${String(score).padStart(6,'0')}</b>`)}else{level++;tone(740,.12,'triangle',.06);setTimeout(()=>tone(988,.18,'triangle',.05),100);makeBricks();paddle.w=Math.max(92,paddle.w-5);parkBall();hud();continueStage=true;show('STAGE '+String(level).padStart(2,'0'),'ステージクリア！　ボールを発射して次へ','次のステージへ');playing=true}}
}
for(const ex of extraBalls){ex.x+=ex.vx*dt*slowFactor;ex.y+=ex.vy*dt*slowFactor;if(ex.x<ex.r+8){ex.x=ex.r+8;ex.vx=Math.abs(ex.vx)}if(ex.x>W-ex.r-8){ex.x=W-ex.r-8;ex.vx=-Math.abs(ex.vx)}if(ex.y<ex.r+8){ex.y=ex.r+8;ex.vy=Math.abs(ex.vy)}if(ex.vy>0&&ex.y+ex.r>=paddle.y&&ex.y-ex.r<=paddle.y+paddle.h&&ex.x>=paddle.x&&ex.x<=paddle.x+paddle.w){const off=(ex.x-(paddle.x+paddle.w/2))/(paddle.w/2),v=Math.hypot(ex.vx,ex.vy);ex.vx=off*v*.82;ex.vy=-Math.sqrt(v*v-ex.vx*ex.vx);tone(420,.06,'triangle',.025)}for(const brick of bricks)if(brick.alive&&ex.x+ex.r>brick.x&&ex.x-ex.r<brick.x+brick.w&&ex.y+ex.r>brick.y&&ex.y-ex.r<brick.y+brick.h){ex.vy*=-1;brick.hp--;if(!brick.hp){brick.alive=false;score+=10*level;breakSound();burst(brick,true);if(Math.random()<.12)drops.push({x:brick.x+brick.w/2,y:brick.y,type:['wide','slow','multi','nova'][Math.floor(Math.random()*4)]});hud()}else{tone(360,.06,'square',.025);pachiPing(860)}break}}extraBalls=extraBalls.filter(ex=>ex.y<H+16);for(const d of drops){d.y=(d.y||0)+2.8*dt;if(d.y+10>=paddle.y&&d.x>=paddle.x&&d.x<=paddle.x+paddle.w){d.caught=true;tone(820,.16,'triangle',.06);shake=Math.max(shake,6);if(d.type==='wide'){paddle.w=Math.min(190,paddle.w+32);flash='WIDE PADDLE!'}else if(d.type==='slow'){slowUntil=performance.now()+7000;flash='TIME SLOW!'}else if(d.type==='multi'){const source=extraBalls.length<4?(extraBalls[extraBalls.length-1]||ball):null;if(source){const speed=Math.hypot(source.vx,source.vy),angle=Math.atan2(source.vy,source.vx);for(const turn of [-.62,.62])if(extraBalls.length<4)extraBalls.push({x:source.x,y:source.y,r:ball.r,vx:Math.cos(angle+turn)*speed,vy:Math.sin(angle+turn)*speed});flash='MULTI BALL!'}else{score+=100*level;flash='MULTI BALL BONUS!'}}else{let targets=bricks.filter(q=>q.alive).sort((a,b)=>Math.hypot(a.x+a.w/2-ball.x,a.y-ball.y)-Math.hypot(b.x+b.w/2-ball.x,b.y-ball.y)).slice(0,5);for(const q of targets){q.alive=false;score+=20*level;burst(q,true)}hud();flash='NOVA BLAST! +'+(targets.length*20*level);shake=14;breakSound()}flashEnd=performance.now()+1100}}drops=drops.filter(d=>!d.caught&&d.y<H);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=.025*dt}particles=particles.filter(p=>p.life>0);for(const t of trail)t.life-=.09;trail=trail.filter(t=>t.life>0)}draw()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
